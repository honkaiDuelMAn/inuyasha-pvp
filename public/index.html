<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>이누야샤 · 데몬 토너먼트 PvP</title><link rel="stylesheet" href="/style.css"><script src="/ruffle/ruffle.js" defer></script><script src="/app.mjs" type="module"></script></head>
<body><main>
<header><div><p class="eyebrow">INUYASHA · DEMON TOURNAMENT</p><h1>1대1 대전</h1></div><button id="original" class="quiet">원본 게임</button></header>
<section id="entry" class="panel entry"><div><h2>친구와 대전하기</h2><p>호스트의 접속 주소를 함께 열고 같은 방에 참가하세요.</p></div><div class="entry-actions"><button id="create">방 만들기</button><form id="joinForm"><input id="roomCode" aria-label="방 코드" maxlength="6" placeholder="방 코드" autocomplete="off"><button>참가</button></form></div></section>
<section id="roomPanel" class="panel" hidden><div class="room-heading"><div><span class="eyebrow">ROOM</span><strong id="code"></strong><span id="seat"></span></div><button id="leave" class="quiet">방 나가기</button></div>
<div class="room-grid"><div><label for="bonusCount">추가카드</label><select id="bonusCount"><option value="0">0장</option><option value="1">1장</option><option value="2">2장</option><option value="3">3장</option></select><p class="hint">경기 시작에 같은 종류를 양쪽에 지급합니다.</p></div><div class="players"><p id="player0"></p><p id="player1"></p></div><div class="ready-actions"><button id="change" class="quiet">캐릭터 바꾸기</button><button id="ready">준비 완료</button><button id="rematch" hidden>캐릭터 다시 선택</button></div></div>
<div id="invitePanel" class="invite"><label for="shareAddress">상대에게 공유할 서버 주소</label><input id="shareAddress" list="addresses" aria-label="상대 접속 주소"><datalist id="addresses"></datalist><button id="copy" class="quiet">초대 링크 복사</button></div>
</section>
<div id="message" role="status" aria-live="polite">방을 만들거나 참가하세요. 원본 게임도 실행할 수 있습니다.</div>
<section class="stage"><div id="gameContainer"><div id="placeholder"><span class="crest">犬</span><p>원래 게임 그대로, 친구와 함께.</p></div></div></section>
<div class="game-footer"><span id="bonusList"></span><div><label class="volume" for="volume">소리 <input id="volume" type="range" min="0" max="100" value="70"></label><button id="fullscreen" class="quiet">전체 화면</button></div></div>
<footer>게임 화면의 PLAY → NORMAL 또는 HARD → 캐릭터 선택 후, 위의 준비 완료를 누르세요.<br>카드 선택과 전투 진행 버튼은 원본 게임과 동일합니다.</footer>
</main></body></html>
